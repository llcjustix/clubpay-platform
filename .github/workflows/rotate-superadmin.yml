name: Rotate production superadmin password
on:
  workflow_dispatch:
    inputs:
      expected_api_commit:
        description: Verified deployed API commit
        type: string
        required: true
      apply_reset:
        description: Explicitly reset the single superadmin and revoke its sessions
        type: boolean
        default: false
      inspect_admin_domain:
        description: Inspect migration CORS and classify database errors without changing data
        type: boolean
        default: false
      verify_password_hash:
        description: Optional private password hash for a read-only equality check
        type: string
        default: ''
permissions:
  contents: read
concurrency:
  group: clubpay-superadmin-recovery
  cancel-in-progress: false
jobs:
  rotate:
    runs-on:
      group: jlearnx runner
      labels: [self-hosted, docker, jlearnx]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify recovery scope regression tests
        run: python3 scripts/diagnostics/test-superadmin-runtime.py
      - name: Inspect running API authority or perform explicitly authorized reset
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          SUPERADMIN_BOOTSTRAP_PASSWORD: ${{ secrets.SUPERADMIN_BOOTSTRAP_PASSWORD }}
          EXPECTED_API_COMMIT: ${{ inputs.expected_api_commit }}
          APPLY_SUPERADMIN_RESET: ${{ inputs.apply_reset }}
          VERIFY_PASSWORD_HASH: ${{ inputs.verify_password_hash }}
        run: |
          if [ "${{ inputs.inspect_admin_domain }}" = true ]; then
            python3 scripts/diagnostics/admin-domain-runtime.py
          else
            python3 scripts/diagnostics/superadmin-runtime.py
          fi
