name: Release ClubPay Controller Node

on:
  push:
    tags: ['controller-v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Test Controller API
        run: go test ./internal/config ./internal/envfile ./internal/httpapi ./cmd/api
      - name: Build local PWA once
        working-directory: web
        run: |
          npm ci
          npm run build
      - name: Package Windows Controller Node
        run: |
          mkdir -p dist/windows/ClubPay-Controller/web dist/windows/ClubPay-Controller/migrations
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o dist/windows/ClubPay-Controller/ClubPay.Controller.exe ./cmd/api
          cp deploy/controller-node/controller.env.example dist/windows/ClubPay-Controller/
          cp deploy/controller-node/postgres-compose.yml dist/windows/ClubPay-Controller/
          cp deploy/controller-node/install-windows.cmd dist/windows/ClubPay-Controller/
          cp deploy/controller-node/README.md dist/windows/ClubPay-Controller/
          cp migrations/*.sql dist/windows/ClubPay-Controller/migrations/
          cp -R web/dist/. dist/windows/ClubPay-Controller/web/
          cd dist/windows && zip -r ../ClubPay-Controller-win-x64.zip ClubPay-Controller
      - name: Package Raspberry Pi Controller Node
        run: |
          mkdir -p dist/linux-arm64/clubpay-controller/web dist/linux-arm64/clubpay-controller/migrations
          GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o dist/linux-arm64/clubpay-controller/clubpay-controller ./cmd/api
          cp deploy/controller-node/controller.env.example dist/linux-arm64/clubpay-controller/
          cp deploy/controller-node/postgres-compose.yml dist/linux-arm64/clubpay-controller/
          cp deploy/controller-node/install-linux.sh dist/linux-arm64/clubpay-controller/
          cp deploy/controller-node/README.md dist/linux-arm64/clubpay-controller/
          chmod +x dist/linux-arm64/clubpay-controller/install-linux.sh
          cp migrations/*.sql dist/linux-arm64/clubpay-controller/migrations/
          cp -R web/dist/. dist/linux-arm64/clubpay-controller/web/
          cd dist/linux-arm64 && tar -czf ../ClubPay-Controller-linux-arm64.tar.gz clubpay-controller
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/ClubPay-Controller-win-x64.zip
            dist/ClubPay-Controller-linux-arm64.tar.gz
