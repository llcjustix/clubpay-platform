name: Prepare Justix mobile demo

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: prepare-justix-mobile-demo
  cancel-in-progress: false

jobs:
  prepare:
    runs-on:
      group: jlearnx runner
      labels: [self-hosted, docker, jlearnx]
    steps:
      - name: Rename demo club and PCs and hide other clubs
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          docker run --rm -i \
            -e PGPASSWORD="$DB_PASSWORD" \
            postgres:16-alpine \
            psql "host=$DB_HOST port=$DB_PORT dbname=$DB_NAME user=$DB_USER sslmode=disable" \
              -v ON_ERROR_STOP=1 <<'SQL'
          BEGIN;
          SET LOCAL lock_timeout = '10s';
          SET LOCAL statement_timeout = '30s';
          LOCK TABLE clubs, pc_refs IN SHARE ROW EXCLUSIVE MODE;
          CREATE TEMP TABLE demo_target AS
            SELECT id FROM clubs WHERE name IN ('CPB Physical Pilot', 'Justix Game Club');
          DO $$
          BEGIN
            IF (SELECT count(*) FROM demo_target) <> 1 THEN
              RAISE EXCEPTION 'Expected exactly one Justix demo club';
            END IF;
            IF (SELECT count(*) FROM pc_refs p JOIN demo_target t ON t.id=p.club_id
                WHERE p.status_cache <> 'deleted') <> 2 THEN
              RAISE EXCEPTION 'Expected exactly two demo PCs';
            END IF;
          END $$;
          SELECT 'before_clubs' AS snapshot, id, name, status FROM clubs ORDER BY name;
          SELECT 'before_pcs' AS snapshot, p.id, p.external_pc_id, p.number, p.label
            FROM pc_refs p JOIN demo_target t ON t.id=p.club_id ORDER BY p.number;
          CREATE TEMP TABLE demo_pc_names AS
            SELECT p.id, row_number() OVER (ORDER BY p.number,p.created_at,p.id)::integer AS n
            FROM pc_refs p JOIN demo_target t ON t.id=p.club_id
            WHERE p.status_cache <> 'deleted';
          UPDATE clubs SET name='Justix Game Club', status='active'
            WHERE id IN (SELECT id FROM demo_target);
          UPDATE pc_refs p SET label=d.n::text FROM demo_pc_names d WHERE p.id=d.id;
          UPDATE clubs SET status='inactive'
            WHERE id NOT IN (SELECT id FROM demo_target) AND status='active';
          DO $$
          BEGIN
            IF (SELECT count(*) FROM clubs WHERE status='active') <> 1 THEN
              RAISE EXCEPTION 'Expected only Justix to remain visible';
            END IF;
          END $$;
          COMMIT;
          SELECT 'after_clubs' AS snapshot, id, name, status FROM clubs ORDER BY name;
          SELECT 'after_pcs' AS snapshot, p.id, p.number, p.label
            FROM pc_refs p JOIN clubs c ON c.id=p.club_id
            WHERE c.name='Justix Game Club' AND p.status_cache <> 'deleted' ORDER BY p.number;
          SQL
