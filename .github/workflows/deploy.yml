name: Deploy Clubpay

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: [self-hosted]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy
        run: |
          set -e

          cd /home/ubuntu/clubpay-platform

          echo "Pull latest code..."
          git pull origin main

          echo "Stop old containers..."
          docker compose down

          echo "Start new containers..."
          docker compose up -d

          echo "Check containers..."
          docker ps