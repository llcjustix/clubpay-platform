name: Build and Deploy Clubpay

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on:
      group: jlearnx runner
      labels: [self-hosted, docker, jlearnx]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show runner information
        run: |
          echo "Runner: $(hostname)"
          echo "Workspace: $GITHUB_WORKSPACE"
          pwd
          docker ps

      - name: Login to Docker Hub
        run: |
          echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login \
            -u "${{ secrets.DOCKER_USERNAME }}" \
            --password-stdin

      # The self-hosted runner builds both large Windows-supporting API images
      # and the PWA. Reclaim stale layers before (not after) the build so an
      # otherwise healthy release cannot fail merely because a previous image
      # exhausted its Docker disk.
      - name: Reclaim Docker disk before build
        run: |
          docker builder prune --all --force
          docker image prune --all --force
          docker container prune --force

      - name: Build API
        run: |
          docker build \
            -t ${{ secrets.DOCKER_USERNAME }}/clubpay-api:${{ github.sha }} \
            -t ${{ secrets.DOCKER_USERNAME }}/clubpay-api:latest \
            .

      - name: Build Web
        run: |
          docker build \
            --build-arg VITE_API_BASE_URL=https://api-clubpay.justix.uz \
            -t ${{ secrets.DOCKER_USERNAME }}/clubpay-web:${{ github.sha }} \
            -t ${{ secrets.DOCKER_USERNAME }}/clubpay-web:latest \
            ./web

      - name: Push images
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/clubpay-api:${{ github.sha }}
          docker push ${{ secrets.DOCKER_USERNAME }}/clubpay-api:latest

          docker push ${{ secrets.DOCKER_USERNAME }}/clubpay-web:${{ github.sha }}
          docker push ${{ secrets.DOCKER_USERNAME }}/clubpay-web:latest

      - name: Reclaim unused Docker disk space
        run: |
          echo "=== Before cleanup ==="
          df -h

          docker builder prune --all --force
          docker image prune --all --force
          docker container prune --force

          echo "=== After cleanup ==="
          df -h

      - name: Deploy
        run: |
          cd "$GITHUB_WORKSPACE"

          echo "=== Deploying from ==="
          pwd

          ls -la

          echo "=== docker-compose files ==="
          ls -la docker-compose*

          export DB_HOST="${{ secrets.DB_HOST }}"
          export DB_PORT="${{ secrets.DB_PORT }}"
          export DB_NAME="${{ secrets.DB_NAME }}"
          export DB_USER="${{ secrets.DB_USER }}"
          export DB_PASSWORD="${{ secrets.DB_PASSWORD }}"

          export DOCKER_USERNAME="${{ secrets.DOCKER_USERNAME }}"
          export IMAGE_TAG="${{ github.sha }}"

          export CORE_MODE="ws"
          export CORE_TOKEN="${{ secrets.CORE_TOKEN }}"

          export EDGE_WOL_TOKEN="${{ secrets.EDGE_WOL_TOKEN }}"
          export WOL_ENABLED="${{ vars.WOL_ENABLED || 'false' }}"
          export WOL_WAIT_SECONDS="${{ vars.WOL_WAIT_SECONDS || '60' }}"

          export TELEGRAM_BOT_TOKEN="${{ secrets.TELEGRAM_BOT_TOKEN }}"
          export TELEGRAM_BOT_USERNAME="clubPay_tg_bot"

          # A production QR must never fall back to mock payment. Provider
          # secrets stay in GitHub Secrets; changing a ClubPay image does not
          # expose them in the repository or Actions output.
          export DEFAULT_PAYMENT_PROVIDER="${{ vars.DEFAULT_PAYMENT_PROVIDER || 'payme' }}"
          export MOCK_PAYMENTS_ENABLED="${{ vars.MOCK_PAYMENTS_ENABLED || 'false' }}"
          export CLICK_MERCHANT_ID="${{ secrets.CLICK_MERCHANT_ID }}"
          export CLICK_SERVICE_ID="${{ secrets.CLICK_SERVICE_ID }}"
          export CLICK_MERCHANT_USER_ID="${{ secrets.CLICK_MERCHANT_USER_ID }}"
          export CLICK_SECRET_KEY="${{ secrets.CLICK_SECRET_KEY }}"
          export PAYME_CHECKOUT_URL="${{ vars.PAYME_CHECKOUT_URL || 'https://checkout.paycom.uz' }}"
          export PAYME_MERCHANT_ID="${{ secrets.PAYME_MERCHANT_ID }}"
          export PAYME_SECRET_KEY="${{ secrets.PAYME_SECRET_KEY }}"
          # Until Flutter gets its own public origin, return a mobile payment
          # to the existing web status page. It polls the same invoice and is
          # therefore a safe fallback for both web and mobile checkouts.
          export MOBILE_RETURN_BASE_URL="${{ vars.MOBILE_RETURN_BASE_URL || 'https://clubpay.justix.uz' }}"

          export TELEGRAM_MINI_APP_ENABLED="${{ vars.TELEGRAM_MINI_APP_ENABLED || 'false' }}"
          export TELEGRAM_POLLING_ENABLED="true"

          echo "=== Pulling images ==="
          docker compose pull api web

          echo "=== Starting containers ==="
          docker compose up -d \
            --remove-orphans \
            --force-recreate

          echo "=== Running containers ==="
          docker ps

      - name: Show application logs on failure
        if: failure()
        run: |
          cd "$GITHUB_WORKSPACE" || exit 0
          docker compose ps
          docker compose logs --tail=100
