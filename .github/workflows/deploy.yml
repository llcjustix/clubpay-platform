name: Build and Deploy Clubpay

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on:
      group: jlearnx runner
      labels: [self-hosted, docker, jlearnx]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # - name: Pull base images
      #   run: |
      #     retry() {
      #       local attempt=1
      #       local max_attempts=5
      #       local delay=15
      #
      #       until "$@"; do
      #         if [ "$attempt" -ge "$max_attempts" ]; then
      #           echo "Command failed after $attempt attempts: $*"
      #           return 1
      #         fi
      #
      #         echo "Command failed, retrying in ${delay}s: $*"
      #         sleep "$delay"
      #         attempt=$((attempt + 1))
      #         delay=$((delay * 2))
      #       done
      #     }
      #
      #     retry docker pull golang:1.22-alpine
      #     retry docker pull node:22-alpine

      - name: Login to Docker Hub
        run: |
          echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login \
            -u "${{ secrets.DOCKER_USERNAME }}" \
            --password-stdin

      - name: Build API
        run: |
          docker build \
            -t ${{ secrets.DOCKER_USERNAME }}/clubpay-api:${{ github.sha }} \
            -t ${{ secrets.DOCKER_USERNAME }}/clubpay-api:latest \
            .

      - name: Build Web
        run: |
          docker build \
            --build-arg VITE_API_BASE_URL=https://api-clubpay.justix.uz \
            -t ${{ secrets.DOCKER_USERNAME }}/clubpay-web:${{ github.sha }} \
            -t ${{ secrets.DOCKER_USERNAME }}/clubpay-web:latest \
            ./web

      - name: Push images
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/clubpay-api:${{ github.sha }}
          docker push ${{ secrets.DOCKER_USERNAME }}/clubpay-api:latest

          docker push ${{ secrets.DOCKER_USERNAME }}/clubpay-web:${{ github.sha }}
          docker push ${{ secrets.DOCKER_USERNAME }}/clubpay-web:latest

      - name: Reclaim unused Docker disk space
        run: |
          df -h .
          docker builder prune --all --force
          docker image prune --all --force
          docker container prune --force
          df -h .

      - name: Deploy
        run: |
          cd "$GITHUB_WORKSPACE"

          export DB_HOST="${{ secrets.DB_HOST }}"
          export DB_PORT="${{ secrets.DB_PORT }}"
          export DB_NAME="${{ secrets.DB_NAME }}"
          export DB_USER="${{ secrets.DB_USER }}"
          export DB_PASSWORD="${{ secrets.DB_PASSWORD }}"
          export DOCKER_USERNAME="${{ secrets.DOCKER_USERNAME }}"
          export IMAGE_TAG="${{ github.sha }}"

          export CORE_MODE="ws"
          export CORE_TOKEN="${{ secrets.CORE_TOKEN }}"

          export EDGE_WOL_TOKEN="${{ secrets.EDGE_WOL_TOKEN }}"
          export WOL_ENABLED="${{ vars.WOL_ENABLED || 'false' }}"
          export WOL_WAIT_SECONDS="${{ vars.WOL_WAIT_SECONDS || '60' }}"

          export TELEGRAM_BOT_TOKEN="${{ secrets.TELEGRAM_BOT_TOKEN }}"
          export TELEGRAM_BOT_USERNAME="clubPay_tg_bot"

          export TELEGRAM_MINI_APP_ENABLED="${{ vars.TELEGRAM_MINI_APP_ENABLED || 'false' }}"
          export TELEGRAM_POLLING_ENABLED="true"

          docker compose pull api web
          docker compose up -d --remove-orphans --force-recreate

          docker ps
