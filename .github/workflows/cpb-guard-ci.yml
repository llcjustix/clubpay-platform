name: CPB guard CI
on:
  pull_request:
  push:
    branches: ['codex/cpb-controller-guard']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: cpb_test
          POSTGRES_PASSWORD: cpb_disposable_ci
          POSTGRES_DB: cpb_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test -race ./...
      - name: Test persistent CPB scheduling fence with PostgreSQL
        env:
          MOBILE_TEST_DATABASE_URL: postgres://cpb_test:cpb_disposable_ci@127.0.0.1:5432/cpb_test?sslmode=disable
        run: go test -race ./internal/httpapi -run TestBootGuard -count=1 -v
      - name: Build Windows Controller
        run: GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -o ClubPay.Controller.exe ./cmd/api
