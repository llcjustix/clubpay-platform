name: Agent Controller settings CI
on:
  pull_request:
  push:
    branches: ['codex/agent-controller-settings']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: routes_test
          POSTGRES_PASSWORD: disposable_routes_ci
          POSTGRES_DB: routes_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: go vet ./...
      - run: go test -race ./...
      - name: Verify durable routes and migration against PostgreSQL
        env:
          MOBILE_TEST_DATABASE_URL: postgres://routes_test:disposable_routes_ci@127.0.0.1:5432/routes_test?sslmode=disable
        run: go test -race ./internal/httpapi -run TestAgentControllerRoutes -count=1 -v
      - name: Build Web
        working-directory: web
        run: |
          npm ci
          npm run build
      - name: Build Windows Controller
        run: GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -o ClubPay.Controller.exe ./cmd/api
