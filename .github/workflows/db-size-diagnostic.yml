name: Read-only ClubPay database size diagnostic

on:
  workflow_dispatch:
    inputs:
      expected_api_commit:
        description: Verified deployed API commit (40-character SHA)
        required: true
        type: string
  push:
    branches: [codex/db-size-diagnostic-20261010]
    paths:
      - .github/workflows/db-size-diagnostic.yml
      - scripts/diagnostics/db-size-readonly.sql

permissions:
  contents: read

concurrency:
  group: clubpay-db-size-diagnostic
  cancel-in-progress: false

jobs:
  inspect:
    runs-on:
      group: jlearnx runner
      labels: [self-hosted, docker, jlearnx]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Read relation sizes and aggregate statistics
        env:
          PGHOST: ${{ secrets.DB_HOST }}
          PGPORT: ${{ secrets.DB_PORT }}
          PGDATABASE: ${{ secrets.DB_NAME }}
          PGUSER: ${{ secrets.DB_USER }}
          PGPASSWORD: ${{ secrets.DB_PASSWORD }}
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          EXPECTED_API_COMMIT: ${{ inputs.expected_api_commit || '17a050f7fb5dafd958358e48ca1dee01723e987f' }}
        run: |
          set -euo pipefail
          if [[ ! "$EXPECTED_API_COMMIT" =~ ^[a-f0-9]{40}$ ]]; then
            echo "A verified deployed API SHA is required" >&2
            exit 1
          fi
          for variable in PGHOST PGPORT PGDATABASE PGUSER PGPASSWORD DOCKER_USERNAME; do
            if [ -z "${!variable}" ]; then
              echo "Required connection setting is unavailable" >&2
              exit 1
            fi
          done
          if [ "$PGDATABASE" != clubpay ]; then
            echo "Refusing to inspect a database other than clubpay" >&2
            exit 1
          fi
          mapfile -t api_containers < <(docker ps \
            --filter "ancestor=$DOCKER_USERNAME/clubpay-api:$EXPECTED_API_COMMIT" \
            --filter label=com.docker.compose.service=api --format '{{.ID}}')
          if [ "${#api_containers[@]}" -ne 1 ]; then
            echo "Expected exactly one running API at the verified deployed commit" >&2
            exit 1
          fi
          API_CONTAINER_ID="${api_containers[0]}" python3 - <<'PYVERIFY'
          import json, os, subprocess, urllib.parse
          data=json.loads(subprocess.check_output(['docker','inspect',os.environ['API_CONTAINER_ID']]))[0]
          env=dict(item.split('=',1) for item in data['Config']['Env'] if '=' in item)
          url=urllib.parse.urlsplit(env.get('DATABASE_URL',''))
          actual=(url.hostname,str(url.port or 5432),urllib.parse.unquote(url.path.lstrip('/')),urllib.parse.unquote(url.username or ''),urllib.parse.unquote(url.password or ''))
          expected=tuple(os.environ[k] for k in ('PGHOST','PGPORT','PGDATABASE','PGUSER','PGPASSWORD'))
          if actual != expected:
              raise SystemExit('Live API database connection does not match diagnostic connection; refusing query')
          print('Verified: diagnostic connection matches the running API database connection. Credentials withheld.')
          PYVERIFY
          echo 'HOST_DISK_CAPACITY'
          df -h
          echo 'CONTAINER_INVENTORY'
          docker ps --format '{{.Names}} | {{.Image}} | {{.Ports}}'
          python3 - <<'PYHOST'
          import json,subprocess,os
          ids=subprocess.check_output(['docker','ps','-q'],text=True).split()
          for cid in ids:
              c=json.loads(subprocess.check_output(['docker','inspect',cid]))[0]
              if 'postgres' in c['Config']['Image'].lower():
                  print('POSTGRES_CONTAINER',c['Name'],c['Config']['Image'])
                  print('MOUNTS',json.dumps(c['Mounts']))
                  print('NETWORKS',json.dumps({k:v.get('IPAddress') for k,v in c['NetworkSettings']['Networks'].items()}))
          for root in ['/var/backups','/backup','/backups','/srv/backups','/home/ubuntu','/mnt','/opt']:
              if not os.path.isdir(root): continue
              print('DIRECTORY',root)
              try:
                  for e in list(os.scandir(root))[:80]:
                      s=e.stat(follow_symlinks=False)
                      print(e.path,'dir' if e.is_dir(follow_symlinks=False) else 'file',s.st_size,int(s.st_mtime))
              except PermissionError: print('unreadable')
          PYHOST
          docker run --rm -i --network "container:${api_containers[0]}" \
            --memory 128m --cpus 0.25 \
            -e PGHOST -e PGPORT -e PGDATABASE -e PGUSER -e PGPASSWORD \
            -e PGSSLMODE=disable -e PGCONNECT_TIMEOUT=5 \
            -e PGAPPNAME=clubpay-size-readonly-diagnostic \
            -e 'PGOPTIONS=-c default_transaction_read_only=on -c statement_timeout=15000 -c lock_timeout=2000' \
            postgres:16-alpine psql -X --no-password -v ON_ERROR_STOP=1 \
            < scripts/diagnostics/db-size-readonly.sql \
            | tee "$RUNNER_TEMP/clubpay-db-size-$GITHUB_RUN_ID.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: clubpay-db-size-readonly
          path: ${{ runner.temp }}/clubpay-db-size-${{ github.run_id }}.txt
          if-no-files-found: error
          retention-days: 7
