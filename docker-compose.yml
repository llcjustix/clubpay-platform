  api:
#    image: golang:1.22-alpine
    # image: clubpay-api:latest
    # Pin deployments to a commit image. Falling back to `latest` keeps local
    # development convenient, while production passes IMAGE_TAG from Actions.
    image: ${DOCKER_USERNAME}/clubpay-api:${IMAGE_TAG:-latest}
    mem_limit: 200m
    cpus: 0.2   
#    working_dir: /app
#    command: sh -c "go mod download && go run ./cmd/api"
    environment:
      APP_ENV: ${APP_ENV:-production}
      NODE_MODE: ${NODE_MODE:-cloud}
      HTTP_ADDR: :8080
      # DATABASE_URL: postgres://clubpay:clubpay@postgres:5432/clubpay?sslmode=disable
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-https://api-clubpay.justix.uz}
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:-https://clubpay.justix.uz}
      ADMIN_API_TOKEN: ${ADMIN_API_TOKEN:-}
      CLOUD_BASE_URL: ${CLOUD_BASE_URL:-}
      DEFAULT_PAYMENT_PROVIDER: ${DEFAULT_PAYMENT_PROVIDER:-mock}
      MOCK_PAYMENTS_ENABLED: ${MOCK_PAYMENTS_ENABLED:-true}
      CLICK_CHECKOUT_URL: ${CLICK_CHECKOUT_URL:-https://my.click.uz/services/pay}
      CLICK_MERCHANT_ID: ${CLICK_MERCHANT_ID:-}
      CLICK_SERVICE_ID: ${CLICK_SERVICE_ID:-}
      CLICK_MERCHANT_USER_ID: ${CLICK_MERCHANT_USER_ID:-}
      CLICK_SECRET_KEY: ${CLICK_SECRET_KEY:-}
      PAYME_CHECKOUT_URL: ${PAYME_CHECKOUT_URL:-https://test.paycom.uz}
      PAYME_MERCHANT_ID: ${PAYME_MERCHANT_ID:-}
      PAYME_SECRET_KEY: ${PAYME_SECRET_KEY:-}
      PLATFORM_FEE_BPS: ${PLATFORM_FEE_BPS:-0}
      SPLIT_PAYMENTS_ENABLED: ${SPLIT_PAYMENTS_ENABLED:-false}
      CORE_MODE: ${CORE_MODE:-mock}
      CORE_BASE_URL: ${CORE_BASE_URL:-http://controller.local:8081}
      CORE_TOKEN: ${CORE_TOKEN:-}
      CORE_TIMEOUT_MS: ${CORE_TIMEOUT_MS:-10000}
      WOL_ENABLED: ${WOL_ENABLED:-false}
      WOL_BROADCAST_ADDR: ${WOL_BROADCAST_ADDR:-255.255.255.255:9}
      WOL_WAIT_SECONDS: ${WOL_WAIT_SECONDS:-60}
      EDGE_SYNC_TOKEN: ${EDGE_SYNC_TOKEN:-}
      EDGE_NODE_ID: ${EDGE_NODE_ID:-}
      EDGE_CLUB_ID: ${EDGE_CLUB_ID:-}
      EDGE_SYNC_INTERVAL_SECONDS: ${EDGE_SYNC_INTERVAL_SECONDS:-15}
      MANAGER_NODE_ID: ${MANAGER_NODE_ID:-}
      MANAGER_CLUB_ID: ${MANAGER_CLUB_ID:-}
      MANAGER_ONLINE_PAYMENTS_ENABLED: ${MANAGER_ONLINE_PAYMENTS_ENABLED:-false}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-}
      TELEGRAM_MINI_APP_ENABLED: ${TELEGRAM_MINI_APP_ENABLED:-false}
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:-}
      TELEGRAM_POLLING_ENABLED: ${TELEGRAM_POLLING_ENABLED:-true}
      VOUCHER_MIN_MINUTES: ${VOUCHER_MIN_MINUTES:-5}
      VOUCHER_TTL_DAYS: ${VOUCHER_TTL_DAYS:-30}
      SESSION_GRACE_SECONDS: ${SESSION_GRACE_SECONDS:-180}

      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DATABASE_URL: postgres://${DB_USER}:${DB_PASSWORD}@${DB_HOST}:${DB_PORT}/${DB_NAME}?sslmode=disable

    ports:
      - "2045:8080"
#    volumes:
#      - .:/app
#      - clubpay-go-cache:/go
    # depends_on:
    #   postgres:
    #     condition: service_healthy

  web:
#    image: node:22-alpine
    # image: clubpay-web:latest
    image: ${DOCKER_USERNAME}/clubpay-web:${IMAGE_TAG:-latest}
    mem_limit: 200m
    cpus: 0.2   
#    working_dir: /app/web
#    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-https://api-clubpay.justix.uz}
    ports:
      - "2046:5173"
#    volumes:
#      - .:/app
#      - clubpay-web-node-modules:/app/web/node_modules
    depends_on:
      - api

volumes:
#  clubpay-postgres:
  clubpay-go-cache:
  clubpay-web-node-modules:
