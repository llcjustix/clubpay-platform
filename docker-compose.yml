services:
  postgres:
    image: postgres:16-alpine
    mem_limit: 200m
    cpus: 0.2    
    environment:
      POSTGRES_DB: clubpay
      POSTGRES_USER: clubpay
      POSTGRES_PASSWORD: clubpay
    ports:
      - "2044:5432"
    volumes:
#      - clubpay-postgres:/var/lib/postgresql/data
      - /home/ubuntu/clubpay-platform/data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clubpay -d clubpay"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
#    image: golang:1.22-alpine
    image: clubpay-api:latest
    mem_limit: 200m
    cpus: 0.2   
#    working_dir: /app
#    command: sh -c "go mod download && go run ./cmd/api"
    environment:
      APP_ENV: ${APP_ENV:-production}
      NODE_MODE: ${NODE_MODE:-cloud}
      HTTP_ADDR: :8080
      DATABASE_URL: postgres://clubpay:clubpay@postgres:5432/clubpay?sslmode=disable
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-https://api-clubpay.justix.uz}
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:-https://clubpay.justix.uz}
      ADMIN_API_TOKEN: ${ADMIN_API_TOKEN:-}
      CLOUD_BASE_URL: ${CLOUD_BASE_URL:-}
      DEFAULT_PAYMENT_PROVIDER: ${DEFAULT_PAYMENT_PROVIDER:-mock}
      CLICK_CHECKOUT_URL: ${CLICK_CHECKOUT_URL:-https://my.click.uz/services/pay}
      CLICK_MERCHANT_ID: ${CLICK_MERCHANT_ID:-}
      CLICK_SERVICE_ID: ${CLICK_SERVICE_ID:-}
      CLICK_SECRET_KEY: ${CLICK_SECRET_KEY:-}
      PAYME_CHECKOUT_URL: ${PAYME_CHECKOUT_URL:-https://test.paycom.uz}
      PAYME_MERCHANT_ID: ${PAYME_MERCHANT_ID:-}
      PAYME_SECRET_KEY: ${PAYME_SECRET_KEY:-}
      PLATFORM_FEE_BPS: ${PLATFORM_FEE_BPS:-0}
      CORE_MODE: ${CORE_MODE:-mock}
      CORE_BASE_URL: ${CORE_BASE_URL:-http://controller.local:8081}
      CORE_TOKEN: ${CORE_TOKEN:-}
      CORE_TIMEOUT_MS: ${CORE_TIMEOUT_MS:-10000}
      EDGE_SYNC_TOKEN: ${EDGE_SYNC_TOKEN:-}
      EDGE_NODE_ID: ${EDGE_NODE_ID:-}
      EDGE_CLUB_ID: ${EDGE_CLUB_ID:-}
      EDGE_SYNC_INTERVAL_SECONDS: ${EDGE_SYNC_INTERVAL_SECONDS:-15}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-}
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:-}
      TELEGRAM_POLLING_ENABLED: ${TELEGRAM_POLLING_ENABLED:-true}
      VOUCHER_MIN_MINUTES: ${VOUCHER_MIN_MINUTES:-5}
      VOUCHER_TTL_DAYS: ${VOUCHER_TTL_DAYS:-30}
    ports:
      - "2045:8080"
#    volumes:
#      - .:/app
#      - clubpay-go-cache:/go
    depends_on:
      postgres:
        condition: service_healthy

  web:
#    image: node:22-alpine
    image: clubpay-web:latest
    mem_limit: 200m
    cpus: 0.2   
#    working_dir: /app/web
#    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-https://api-clubpay.justix.uz}
    ports:
      - "2046:5173"
#    volumes:
#      - .:/app
#      - clubpay-web-node-modules:/app/web/node_modules
    depends_on:
      - api

volumes:
#  clubpay-postgres:
  clubpay-go-cache:
  clubpay-web-node-modules:
