services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: clubpay
      POSTGRES_USER: clubpay
      POSTGRES_PASSWORD: ${LOCAL_POSTGRES_PASSWORD:?set LOCAL_POSTGRES_PASSWORD in controller.env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - clubpay-controller-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clubpay -d clubpay"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  clubpay-controller-postgres:
