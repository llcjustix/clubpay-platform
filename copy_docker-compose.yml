services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: clubpay
      POSTGRES_USER: clubpay
      POSTGRES_PASSWORD: clubpay
    ports:
      - "5432:5432"
    volumes:
      - clubpay-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clubpay -d clubpay"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    image: golang:1.22-alpine
    working_dir: /app
    command: sh -c "go mod download && go run ./cmd/api"
    environment:
      APP_ENV: development
      HTTP_ADDR: :8080
      DATABASE_URL: postgres://clubpay:clubpay@postgres:5432/clubpay?sslmode=disable
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8080}
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:-http://localhost:5173}
      ADMIN_API_TOKEN: ${ADMIN_API_TOKEN:-}
      DEFAULT_PAYMENT_PROVIDER: ${DEFAULT_PAYMENT_PROVIDER:-mock}
      CLICK_CHECKOUT_URL: ${CLICK_CHECKOUT_URL:-https://my.click.uz/services/pay}
      CLICK_MERCHANT_ID: ${CLICK_MERCHANT_ID:-}
      CLICK_SERVICE_ID: ${CLICK_SERVICE_ID:-}
      CLICK_MERCHANT_USER_ID: ${CLICK_MERCHANT_USER_ID:-}
      CLICK_SECRET_KEY: ${CLICK_SECRET_KEY:-}
      PAYME_CHECKOUT_URL: ${PAYME_CHECKOUT_URL:-https://test.paycom.uz}
      PAYME_MERCHANT_ID: ${PAYME_MERCHANT_ID:-}
      PAYME_SECRET_KEY: ${PAYME_SECRET_KEY:-}
      PLATFORM_FEE_BPS: ${PLATFORM_FEE_BPS:-0}
      CORE_MODE: ${CORE_MODE:-mock}
      CORE_BASE_URL: ${CORE_BASE_URL:-http://controller.local:8081}
      CORE_TOKEN: ${CORE_TOKEN:-}
      CORE_TIMEOUT_MS: ${CORE_TIMEOUT_MS:-10000}
      VOUCHER_MIN_MINUTES: ${VOUCHER_MIN_MINUTES:-5}
      VOUCHER_TTL_DAYS: ${VOUCHER_TTL_DAYS:-30}
    ports:
      - "8080:8080"
    volumes:
      - .:/app
      - clubpay-go-cache:/go
    depends_on:
      postgres:
        condition: service_healthy

  web:
    image: node:22-alpine
    working_dir: /app/web
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8080}
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - clubpay-web-node-modules:/app/web/node_modules
    depends_on:
      - api

volumes:
  clubpay-postgres:
  clubpay-go-cache:
  clubpay-web-node-modules:
